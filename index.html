<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>W² Ai – Learn. Practice. Research. Grow.</title>
<style>
:root{--c:#22d3ee;--v:#7c3aed;color-scheme:dark}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,sans-serif;color:#e8eaff;background:radial-gradient(1000px 500px at 10% -10%,#4c1d95,transparent 60%),radial-gradient(800px 450px at 100% 0,#0e7490,transparent 55%),#0b1020;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:#67e8f9}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(15,23,42,.75);backdrop-filter:blur(10px);border-bottom:1px solid #fff2;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;color:#fff;text-decoration:none}.brand img{height:38px;border-radius:8px;background:#fff}
nav a,nav button{color:#fff;text-decoration:none;margin-left:12px;background:none;border:0;font-size:1rem;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:18px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:rgba(255,255,255,.07);border:1px solid #fff2;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0006;margin-bottom:16px}a.card{text-decoration:none;color:inherit}a.card:hover{border-color:var(--c)}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;border:0;background:linear-gradient(90deg,#06b6d4,var(--v));color:#fff;font-size:1rem;cursor:pointer;text-decoration:none;margin:4px 4px 4px 0}.btn.alt{background:none;border:2px solid var(--c);color:var(--c)}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:11px;margin:5px 0 12px;border:0;border-radius:10px;font-size:1rem;background:#f8fafc;color:#111}label{font-weight:600}
.hero{text-align:center;color:#fff;padding:36px 14px;border-radius:24px;background:linear-gradient(120deg,#2563eb,#7c3aed,#06b6d4,#2563eb);background-size:300% 300%;animation:g 10s ease infinite;box-shadow:0 0 60px #7c3aed66}
.hero h1{font-size:3.4rem;margin:6px 0;text-shadow:0 0 30px #67e8f9}.hero img{width:140px;background:#fff;border-radius:24px;padding:6px;animation:f 3s ease-in-out infinite}.big{background:#fff;color:#4c1d95;font-weight:700}
@keyframes f{50%{transform:translateY(-10px)}}@keyframes g{50%{background-position:100% 50%}}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:10px;border:2px solid #fff3;background:#ffffff0f;color:#fff;font-size:1rem;cursor:pointer}.opt.sel{background:#7c3aed88;border-color:#a78bfa}.opt.good{background:#16a34a66;border-color:#4ade80}.opt.bad{background:#dc262666;border-color:#f87171}
.err{color:#fca5a5}.ok{color:#86efac}.m{padding:9px 12px;border-radius:12px;margin:8px 0;max-width:88%;white-space:pre-wrap}.m.u{background:#2563eb;margin-left:auto}.m.b{background:#ffffff1a}
.nav button{margin:2px;width:34px;height:34px;border-radius:8px;border:1px solid #a78bfa;background:#fff;color:#111;cursor:pointer}.nav button.a{background:#c4b5fd}.nav button.c{outline:3px solid var(--c)}
footer{text-align:center;padding:22px}footer a{margin:0 8px}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:linear-gradient(90deg,#06b6d4,var(--v));color:#fff;font-size:1.6rem;display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 20px #7c3aed99}
pre{white-space:pre-wrap;font-family:inherit;margin:0}@media(max-width:600px){.hero h1{font-size:2.5rem}}
</style></head><body>

function subject(id){const [tp,nm]=S[id];const A=$("#app");const tabs=[["notes","Study Notes"],["quiz","MCQ Quiz"],["research","Research"],["books","Books"]];
 let body="";if(tab==="notes")body=`<input id="sq" placeholder="Search notes…">${NOTES[id].map(n=>`<p class="note">${esc(n)}</p>`).join("")}<p style="opacity:.7">Sample notes. Ask the AI Chat for detailed explanations or exam answers.</p>`;

 if(tab==="books")body=(BOOKS[id]||[]).map(b=>`<p>📖 <b>${b[0]}</b> <a class="btn alt" target="_blank" rel="noopener" href="${b[1]}">Open Free Book ↗</a></p>`).join("")||"<p>No free book linked yet for this subject.</p>";
 A.innerHTML=`<p><a href="#/dashboard">Dashboard</a> → <a href="#/topics/${tp}">${T[tp][1]}</a> → ${nm}</p><h2>${nm}</h2>${tabs.map(t=>`<button class="btn ${tab===t[0]?"":"alt"}" data-t="${t[0]}">${t[1]}</button>`).join("")}<div class="card" style="margin-top:12px">${body}</div><a class="btn alt" href="#/topics/${tp}">Back to Subjects</a>`;
 A.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;qz=null;subject(id)});
 const sq=$("#sq");if(sq)sq.oninput=()=>A.querySelectorAll(".note").forEach(p=>p.style.display=p.textContent.toLowerCase().includes(sq.value.toLowerCase())?"":"none");
 if(tab==="quiz")quizStart(id);
 const rq=$("#rq");if(rq)rq.onclick=async()=>{rq.disabled=true;$("#rr").innerHTML="<p>Thinking…</p>";try{const s=await ask();const r=await s(`Suggest 5 research questions, keywords and a short methodology outline for a college project in ${nm}. Do NOT invent papers, authors or DOIs.`,{cache:false});$("#rr").innerHTML=`<div class="m b">${esc(r.text)}</div>`}catch(e){$("#rr").innerHTML=`<p class="err">${esc(e.message||"AI unavailable")}</p>`}rq.disabled=false}}
function quizStart(id,msg=""){const q=$("#qz");q.innerHTML=`<p>${BANK[id].length} sample questions are built in. For a full test, let AI write 50 new questions (a different set each time).</p><button class="btn" id="ai">🎲 New 50-Mark AI Test</button><button class="btn alt" id="bk">Bank questions</button><p class="err">${esc(msg)}</p>`;
 $("#bk").onclick=()=>{qz={id,i:0,a:{},done:false,qs:BANK[id].map(x=>({q:x[0],o:x[1],c:x[2],e:x[3]}))};quizShow()};
 $("#ai").onclick=async()=>{const b=$("#ai");b.disabled=true;b.textContent="Writing 50 new questions… (up to a minute)";try{const s=await ask();const seed=Math.random().toString(36).slice(2);
  const v=await s.json(`Write 50 original, different multiple-choice questions for the college subject "${S[id][1]}" (variation seed ${seed}) covering many chapters with mixed Easy/Medium/Hard difficulty. Return ONLY a JSON array of objects: {"q":"","o":["","","",""],"c":0,"e":""} where c is the 0-based index of the single correct option and e a short explanation matching it. ${id==="company-law"?"Use India's Companies Act, 2013.":""}`,{cache:false});
  const qs=(Array.isArray(v)?v:[]).filter(x=>x.q&&x.o?.length===4&&x.c>=0&&x.c<4&&x.e).slice(0,50);if(qs.length<10)throw{message:"Too few valid questions were returned. Please try again."};qz={id,i:0,a:{},done:false,qs};quizShow()}catch(e){quizStart(id,e.message||"Could not generate the test.")}}}
function quizShow(){const q=$("#qz");const Q=qz.qs,i=qz.i,x=Q[i];
 if(qz.done){const sc=Q.filter((y,k)=>qz.a[k]===y.c).length;q.innerHTML=`<h3>Score: ${sc}/${Q.length} (${Math.round(100*sc/Q.length)}%)</h3><p>Correct: ${sc} · Incorrect: ${Q.length-sc}</p>${Q.map((y,k)=>`<div><p><b>${k+1}. ${esc(y.q)}</b></p><p class="${qz.a[k]===y.c?"ok":"err"}">${qz.a[k]===y.c?"Correct":`Your answer: ${qz.a[k]==null?"none":esc(y.o[qz.a[k]])} · Correct: ${esc(y.o[y.c])}`}</p><p>${esc(y.e)}</p></div>`).join("")}<button class="btn" id="rt">${Q.length>=40?"New Test":"Retake"}</button>`;$("#rt").onclick=()=>quizStart(qz.id);return}
 q.innerHTML=`<progress style="width:100%" max="${Q.length}" value="${Object.keys(qz.a).length}"></progress><p>Question ${i+1} of ${Q.length}</p><div class="nav">${Q.map((_,k)=>`<button data-k="${k}" class="${qz.a[k]!=null?"a":""} ${k===i?"c":""}">${k+1}</button>`).join("")}</div><h3>${esc(x.q)}</h3>${x.o.map((o,k)=>`<button class="opt ${qz.a[i]===k?"sel":""}" data-o="${k}">${"ABCD"[k]}. ${esc(o)}</button>`).join("")}<button class="btn alt" id="pv" ${i?"":"disabled"}>Previous</button><button class="btn alt" id="nx" ${i<Q.length-1?"":"disabled"}>Next</button><button class="btn" id="sb">Submit Test</button>`;
 q.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{qz.a[i]=+b.dataset.o;quizShow()});q.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{qz.i=+b.dataset.k;quizShow()});
 $("#pv").onclick=()=>{qz.i--;quizShow()};$("#nx").onclick=()=>{qz.i++;quizShow()};$("#sb").onclick=()=>{qz.done=true;quizShow()}}
function chatView(){$("#app").innerHTML=`<div class="card"><h2>🤖 W² Ai Research Assistant</h2><div id="msgs" style="min-height:240px;max-height:55vh;overflow:auto"></div><div id="ideas"></div><div style="display:flex;gap:8px"><textarea id="ci" rows="2" style="margin:0" placeholder="Ask anything about your subjects… (Enter to send)"></textarea><button class="btn" id="cs" style="margin:0">Send</button></div><button class="btn alt" id="cn">New chat</button></div>`;
 const draw=()=>{$("#msgs").innerHTML=chat.map(m=>`<div class="m ${m.role==="user"?"u":"b"}">${esc(m.content)}</div>`).join("")+(busy&&!chat.at(-1)?.content?'<div class="m b">Thinking…</div>':"");$("#msgs").scrollTop=1e9;$("#ideas").innerHTML=chat.length?"":["Explain glycolysis simply","Give me 5 MCQs on the Companies Act 2013","Suggest a research topic in microbiology"].map(t=>`<button class="opt">${t}</button>`).join("");$("#ideas").querySelectorAll("button").forEach(b=>b.onclick=()=>send(b.textContent))};
 const send=async t=>{t=(t||$("#ci").value).trim();if(!t||busy)return;$("#ci").value="";chat.push({role:"user",content:t});chat.push({role:"assistant",content:""});busy=true;draw();
  try{const s=await ask();const hist=chat.slice(0,-1).map((m,k)=>({role:m.role,content:k===0?"You are the W² Ai Research Assistant for college students (Life Science, Medical Coding, B.Com). Be accurate and clear; never invent papers or citations.\n\n"+m.content:m.content}));
   const r=await s(hist,{cache:false,onText:({text})=>{chat.at(-1).content=text;draw()}});chat.at(-1).content=r.text}catch(e){chat.at(-1).content="Sorry, the assistant is unavailable: "+(e.message||"error")}busy=false;draw()};
 $("#cs").onclick=()=>send();$("#ci").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#cn").onclick=()=>{chat=[];draw()};draw()}
